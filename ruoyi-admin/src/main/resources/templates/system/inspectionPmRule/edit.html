<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('修改周PM检查规则')" />
    <th:block th:include="include :: datetimepicker-css" />
    <th:block th:include="include :: select2-css" />
    <th:block th:include="include :: bootstrap-select-css" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-inspectionPmRule-edit" th:object="${nxpInspectionPmRule}">
            <input name="id" th:field="*{id}" type="hidden">
            <div class="form-group">
                <label class="col-sm-3 control-label">人员筛选条件：</label>
                <div class="col-sm-8">
                    <select name="area" id="area" class="form-control m-b" th:with="type=${@dict.getType('area_arr')}">
                        <option value="">请选择区域</option>
                        <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}" th:field="${userInfo.area}"></option>
                    </select>
                    <select name="shift" id="shift" class="form-control m-b" th:with="type=${@dict.getType('shift_arr')}">
                        <option value="">请选择班别</option>
                        <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}" th:field="${userInfo.shift}"></option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">周PM - 负责人：</label>
                <div class="col-sm-8">
                    <select name="user_id" id="owner" class="form-control m-b">
                        <option value="">请选择负责人</option>
                        <option th:each="nxpUserInfo : ${nxpUserInfos}" th:text ="${nxpUserInfo.chinese_name}+'('+${nxpUserInfo.pid}+')'" th:value="${nxpUserInfo.id}" th:field="*{user_id}"></option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">人员筛选条件：</label>
                <div class="col-sm-8">
                    <select name="review_area" id="review_area" class="form-control m-b" th:with="type=${@dict.getType('area_arr')}">
                        <option value="">请选择区域</option>
                        <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}" th:field="${reviewUserInfo.area}"></option>
                    </select>
                    <select name="review_shift" id="review_shift" class="form-control m-b" th:with="type=${@dict.getType('shift_arr')}">
                        <option value="">请选择班别</option>
                        <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}" th:field="${reviewUserInfo.shift}"></option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">周PM复查 - 负责人：</label>
                <div class="col-sm-8">
                    <select name="review_user_id" id="review_owner" class="form-control m-b">
                        <option value="">请选择周PM复查 - 负责人</option>
                        <option th:each="reviewUserInfo : ${nxpUserInfos}" th:text ="${reviewUserInfo.chinese_name}" th:value="${reviewUserInfo.id}" th:field="*{review_user_id}"></option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">设备编号：</label>
                <div class="col-sm-8">
                    <input name="facility_number" th:field="*{facilityNumber}" class="form-control" type="text" readonly>
                    <input name="facility_id" th:field="*{facility_id}" type="hidden">
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">PM周期：</label>
                <div class="col-sm-8">
                    <input name="cycle" th:field="*{cycle}" class="form-control" type="number">
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">规则开始时间：</label>
                <div class="col-sm-8">
                    <div class="input-group date">
                        <input name="beginTime" th:value="${#dates.format(nxpInspectionPmRule.beginTime, 'yyyy-MM-dd')}" class="form-control" placeholder="yyyy-MM-dd" type="date">
                        <span class="input-group-addon"><i class="fa fa-calendar"></i></span>
                    </div>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">检查组：</label>
                <div class="col-sm-8">
                    <select name="group_id" class="form-control m-b">
                        <option value="">请选择检查组</option>
                        <option  th:each="nxpInspectionPmGroup:${nxpInspectionPmGroups}" th:value="${nxpInspectionPmGroup.id}" th:text="${nxpInspectionPmGroup.name}" th:field="*{group_id}" ></option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">状态：</label>
                <div class="col-sm-8">
                    <select name="status" class="form-control m-b" th:with="type=${@dict.getType('is_enable')}">
                        <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}" th:field="*{status}"></option>
                    </select>
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <th:block th:include="include :: datetimepicker-js" />
    <th:block th:include="include :: select2-js" />
    <th:block th:include="include :: bootstrap-select-js" />
    <script th:inline="javascript">
        var prefix = ctx + "system/inspectionPmRule";
        $("#form-inspectionPmRule-edit").validate({
            focusCleanup: true
        });


        // 区域
        $("#area").change(function () {
            let area = $("#area").val();
            let shift = $("#shift").val();
            $.ajax({
                url: ctx + "system/model" + "/getUserByAreaAndShift",
                type: "POST",
                data: {"area":area,"shift":shift},
                success: function (result) {
                    let str = "";
                    $.each(result.msg, function(index, value){
                        str += '<option value="' + value.id + '">' + value.chinese_name + '</option>';
                    });
                    //清空之前其他上级菜单遗留的子菜单，否则改变上级菜单后子菜单会包含多个上级菜单的全部子菜单
                    $("#owner").empty();
                    $("#owner").append('<option value="">---请选择负责人---</option>' + str);
                },
                error: function(error) {
                    $.modal.alertWarning("失败。");
                }});
        });
        // 班别
        $("#shift").change(function () {
            let area = $("#area").val();
            let shift = $("#shift").val();
            $.ajax({
                url: ctx + "system/model" + "/getUserByAreaAndShift",
                type: "POST",
                data: {"area":area,"shift":shift},
                success: function (result) {
                    let str = "";
                    $.each(result.msg, function(index, value){
                        str += '<option value="' + value.id + '">' + value.chinese_name + '('+ value.pid +')' + '</option>';
                    });
                    //清空之前其他上级菜单遗留的子菜单，否则改变上级菜单后子菜单会包含多个上级菜单的全部子菜单
                    $("#owner").empty();
                    $("#owner").append('<option value="">---请选择负责人---</option>' + str);
                },
                error: function(error) {
                    $.modal.alertWarning("失败。");
                }});
        });

        // 区域
        $("#review_area").change(function () {
            let area = $("#review_area").val();
            let shift = $("#review_shift").val();
            $.ajax({
                url: ctx + "system/model" + "/getUserByAreaAndShift",
                type: "POST",
                data: {"area":area,"shift":shift},
                success: function (result) {
                    let str = "";
                    $.each(result.msg, function(index, value){
                        str += '<option value="' + value.id + '">' + value.chinese_name + '('+ value.pid +')' + '</option>';
                    });
                    //清空之前其他上级菜单遗留的子菜单，否则改变上级菜单后子菜单会包含多个上级菜单的全部子菜单
                    $("#review_owner").empty();
                    $("#review_owner").append('<option value="">---请选择负责人---</option>' + str);
                },
                error: function(error) {
                    $.modal.alertWarning("失败。");
                }});
        });
        // 班别
        $("#review_shift").change(function () {
            let area = $("#review_area").val();
            let shift = $("#review_shift").val();
            $.ajax({
                url: ctx + "system/model" + "/getUserByAreaAndShift",
                type: "POST",
                data: {"area":area,"shift":shift},
                success: function (result) {
                    let str = "";
                    $.each(result.msg, function(index, value){
                        str += '<option value="' + value.id + '">' + value.chinese_name + '('+ value.pid +')' + '</option>';
                    });
                    //清空之前其他上级菜单遗留的子菜单，否则改变上级菜单后子菜单会包含多个上级菜单的全部子菜单
                    $("#review_owner").empty();
                    $("#review_owner").append('<option value="">---请选择负责人---</option>' + str);
                },
                error: function(error) {
                    $.modal.alertWarning("失败。");
                }});
        });

        function submitHandler() {
            if ($.validate.form()) {
                $.operate.save(prefix + "/edit", $('#form-inspectionPmRule-edit').serialize());
            }
        }

        // $("input[name='beginTime']").datetimepicker({
        //     format: "yyyy-mm-dd hh:ii:ss",
        //     autoclose: true
        // });
    </script>
</body>
</html>
