<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('周PM检查列表')" />
    <th:block th:include="include :: select2-css" />
    <th:block th:include="include :: bootstrap-select-css" />
</head>
<body class="gray-bg">
     <div class="container-div">
        <div class="row">
            <div class="col-sm-12 search-collapse">
                <form id="formId">
                    <div class="select-list">
                        <ul>
                            <li>
                                <label>工序：</label>
                                <select name="process" id="process_id">
                                    <option value="">所有</option>
                                    <option th:each="process:${processes}" th:text="${process.name}" th:value="${process.id}"></option>
                                </select>
                            </li>
                            <li>
                                <label>设备：</label>
                                <select class="form-control" name="facility_id" id="facility_id">
                                    <option value="">所有</option>
                                    <option th:each="facility : ${facilityList}" th:text="${facility.number}" th:value="${facility.id}"></option>
                                </select>
                            </li>
                            <li>
                                <label>检查时间：</label>
                                <input type="text" class="time-input" placeholder="请选择检查时间 (排班检查时间)" name="check_time"/>
                            </li>
                            <li>
                                <label>检查状态：</label>
                                <select name="type" th:with="type=${@dict.getType('pm_type')}">
                                    <option value="">所有</option>
                                    <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"></option>
                                </select>
                            </li>
                            <li>
                                <label>周PM人：</label>
                                <select class="form-control" name="userInfo_id">
                                    <option value="">所有</option>
                                    <option th:each="nxpUserInfo : ${nxpUserInfos}" th:text="${nxpUserInfo.chinese_name}" th:value="${nxpUserInfo.id}"></option>
                                </select>
                            </li>
                            <li>
                                <label>周PM复查人：</label>
                                <select class="form-control" name="review_user_info_id">
                                    <option value="">所有</option>
                                    <option th:each="nxpUserInfo : ${nxpUserInfos}" th:text="${nxpUserInfo.chinese_name}" th:value="${nxpUserInfo.id}"></option>
                                </select>
                            </li>
                            <li>
                                <a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;搜索</a>
                                <a class="btn btn-warning btn-rounded btn-sm" onclick="resetPre()"><i class="fa fa-refresh"></i>&nbsp;重置</a>
                            </li>
                        </ul>
                    </div>
                </form>
            </div>

            <div class="btn-group-sm" id="toolbar" role="group">
                <a class="btn btn-warning" onclick="$.table.exportExcel()" shiro:hasPermission="system:InspectionPm:export">
                    <i class="fa fa-download"></i> 导出
                </a>
            </div>
            <div class="col-sm-12 select-table table-striped">
                <table id="bootstrap-table"></table>
            </div>
        </div>
    </div>
    <th:block th:include="include :: footer" />
     <th:block th:include="include :: select2-js" />
     <th:block th:include="include :: bootstrap-select-js" />
    <script th:inline="javascript">
        var editFlag = [[${@permission.hasPermi('system:InspectionPm:edit')}]];
        var removeFlag = [[${@permission.hasPermi('system:InspectionPm:remove')}]];
        var statusDatas = [[${@dict.getType('check_status')}]];
        var prefix = ctx + "system/InspectionPm";
        var userId = [[${@permission.getPrincipalProperty('userId')}]];

        $(function() {
            var options = {
                url: prefix + "/list",
                createUrl: prefix + "/add",
                updateUrl: prefix + "/edit/{id}",
                removeUrl: prefix + "/remove",
                exportUrl: prefix + "/export",
                modalName: "周PM检查",
                columns: [{
                    checkbox: true
                },
                {
                    field: 'id',
                    title: '主键',
                    visible: false
                },
                {
                    field: 'facility_name',
                    title: '设备编号'
                },
                {
                    field: 'type_name',
                    title: '类型'
                },
                {
                    field: 'userName',
                    title: '周PM人'
                },
                {
                    field: 'reviewUserName',
                    title: '周PM复查人'
                },
                {
                    field: 'status_name',
                    title: '检查状态'
                },
                {
                    field: 'check_time',
                    title: '计划时间'
                },
                {
                    field: 'real_check_time',
                    title: '实际PM时间'
                },
                {
                    title: '操作',
                    align: 'center',
                    formatter: function(value, row, index) {
                        var actions = [];
                        actions.push('<a class="btn btn-success btn-xs ' + editFlag + '" href="javascript:void(0)" onclick="$.operate.edit(\'' + row.id + '\')"><i class="fa fa-edit"></i>查看</a> ');
                        if (userId == 1) {
                            actions.push('<a class="btn btn-danger btn-xs ' + removeFlag + '" href="javascript:void(0)" onclick="$.operate.remove(\'' + row.id + '\')"><i class="fa fa-remove"></i>删除</a>');
                        }
                        return actions.join('');
                    }
                }]
            };
            $.table.init(options);
        });
        
        function resetPre() {
            $("#formId")[0].reset();
            $("[name='facility_id']").val([""]).trigger("change");
        }


        // 工序
        $("#process_id").change(function () {
            let processId = $("#process_id").val();
            $.ajax({
                url: prefix + "/getMathineByProcess",
                type: "POST",
                data: {"process_id":processId},
                success: function (result) {
                    let str = "";
                    $.each(result.msg, function(index, value){
                        str += '<option value="' + value.id + '">' + value.number + '</option>';
                    });
                    //清空之前其他上级菜单遗留的子菜单，否则改变上级菜单后子菜单会包含多个上级菜单的全部子菜单
                    $("#facility_id").empty();
                    $("#facility_id").append('<option value="">---请选择工序---</option>' + str);
                },
                error: function(error) {
                    $.modal.alertWarning("失败。");
                }});

        });
    </script>
</body>
</html>
