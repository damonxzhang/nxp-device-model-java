<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('新增模具维护检查项')" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-nxpMoldMaintenanceGroupItem-add">
            <div class="form-group">    
                <label class="col-sm-3 control-label">分组：</label>
                <div class="col-sm-8">
                    <select name="groupId" class="form-control m-b" th:with="type=${groups}">
                        <option value="">请选择分组</option>
                        <option th:each="dict : ${type}" th:text="${dict.groupName}" th:value="${dict.id}"></option>
                    </select>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">检查项：</label>
                <div class="col-sm-8">
                    <input name="itemName" class="form-control" type="text">
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">状态：</label>
                <div class="col-sm-8">
                    <select name="itemStatus" class="form-control m-b" th:with="type=${@dict.getType('is_enable')}">
                        <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"></option>
                    </select>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">是否拍照：</label>
                <div class="col-sm-8">
                    <select name="isPhotograph" class="form-control m-b" th:with="type=${@dict.getType('is_pic')}">
                        <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"></option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">模具种类：</label>
                <div class="col-sm-8">
                    <select name="moldTypeId" class="form-control m-b" id="moldTypeId" th:with="type=${nxpMoldTypes}">
                        <option value="">-----请选择模具种类-----</option>
                        <option th:each="dict : ${type}" th:text="${dict.moldTypeName}" th:value="${dict.id}"></option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">模具部件：</label>
                <div class="col-sm-8">
                    <select name="componentId" id="componentId" class="form-control m-b">
                        <option value="">-----请先选择模具种类-----</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">模具类型：</label>
                <div class="col-sm-8">
                    <select name="moldType" class="form-control m-b">
                        <option th:text="BA" th:value="2"></option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">备注：</label>
                <div class="col-sm-8">
                    <textarea name="remark" class="form-control"></textarea>
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var prefix = ctx + "system/nxpMoldMaintenanceGroupItem"
        $("#form-nxpMoldMaintenanceGroupItem-add").validate({
            focusCleanup: true
        });

        function submitHandler() {
            if ($.validate.form()) {
                $.operate.save(prefix + "/add", $('#form-nxpMoldMaintenanceGroupItem-add').serialize());
            }
        }

        // 模具种类和部件联动
        $("#moldTypeId").change(function () {
            var moldTypeId = $("#moldTypeId").val();
            if (moldTypeId == "" || moldTypeId == undefined){
                $("#componentId").empty();
                $("#componentId").append('<option value="">-----请先选择模具种类-----</option>');
            }else {
                $.ajax({
                    url: ctx + "system/nxpMoldType/getByMoldTypeId",
                    type: "POST",
                    data: {"moldTypeId" : moldTypeId},
                    success: function (result) {
                        var str = "";
                        $.each(result.data, function(index, value){
                            str += '<option value="' + value.componentId + '">' + value.componentName + '</option>';
                        });
                        //清空之前其他上级菜单遗留的子菜单，否则改变上级菜单后子菜单会包含多个上级菜单的全部子菜单
                        $("#componentId").empty();
                        $("#componentId").append('<option value="">-----请选择模具种类-----</option>' + str);
                    },
                    error: function(error) {
                        $.modal.alertWarning("失败。");
                    }});
            }
        });
    </script>
</body>
</html>
