<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('修改模具维护检查结果')" />
    <th:block th:include="include :: datetimepicker-css" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-nxpMoldMaintenanceCheck-edit" th:object="${nxpMoldMaintenanceCheck}">
            <input name="id" th:field="*{id}" type="hidden">
            <div class="form-group">
                <label class="col-sm-3 control-label">检查项：</label>
                <div class="col-sm-8">
                    <input name="groupItemName" th:field="*{groupItemName}" class="form-control" type="text" readonly>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">检查时间：</label>
                <div class="col-sm-8">
                    <div class="input-group date">
                        <input name="checkTime" th:value="${#dates.format(nxpMoldMaintenanceCheck.checkTime, 'yyyy-MM-dd HH:mm:ss')}" class="form-control" placeholder="yyyy-MM-dd HH:mm:ss" type="text" readonly>
                        <span class="input-group-addon"><i class="fa fa-calendar"></i></span>
                    </div>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">检查人：</label>
                <div class="col-sm-8">
                    <input name="userInfoName" th:field="*{userInfoName}" class="form-control" type="text" readonly>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">检查项结果：</label>
                <div class="col-sm-8">
                    <select name="groupItemResult" class="form-control m-b" th:with="type=${@dict.getType('maintenance_result')}" disabled>
                        <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}" th:field="*{groupItemResult}"></option>
                    </select>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">图片：</label>
                <div class="col-sm-8">
                    <a th:each="file : ${files}" th:href="${file.filePath}" th:title="${file.filePath}" target="_blank">
                        <img style="width: 20%;height: 20%"  th:src="${file.filePath}" class="form-control" ></a>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">备注：</label>
                <div class="col-sm-8">
                    <textarea name="remark" class="form-control" readonly>[[*{remark}]]</textarea>
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <th:block th:include="include :: datetimepicker-js" />
    <script th:inline="javascript">
        var prefix = ctx + "system/nxpMoldMaintenanceCheck";
        $("#form-nxpMoldMaintenanceCheck-edit").validate({
            focusCleanup: true
        });

        $("input[name='checkTime']").datetimepicker({
            format: "yyyy-mm-dd HH:mm:ss",
            minView: "month",
            autoclose: true
        });

        $(document).ready(function () {
            var small = $('.small_img'); //小图
            var big_div = $('#big_div'); //大图弹出层
            var small_size = $('#small_size'); //显示小图实际尺寸区域
            var big_size = $('#big_size'); //显示大图实际尺寸区域
            var smallWidth = small.width(); //小图宽度
            var smallHeight = small.height(); //小图高度
            var bigWidth = $('.big_img').width(); //大图宽度
            var bigHeight = $('.big_img').height(); //大图高度
            var small_str = smallWidth + ' X ' + smallHeight + ' 像素';
            var big_str = bigWidth + ' X ' + bigHeight + ' 像素';
            small_size.text(small_str);  //显示小图片实际尺寸
            small.click(function () { //点击显示大图弹出层
                big_div.show();//也可换做big_div.toggle();去除关闭按钮
                big_size.text(big_str);
                $('#bb').hide();
            });

            $('#aa').click(function () {
                big_div.hide();
                $('#bb').show();

            });
        });
    </script>
</body>
</html>
