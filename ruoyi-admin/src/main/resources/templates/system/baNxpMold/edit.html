<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('修改模具管理')" />
    <th:block th:include="include :: select2-css" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-nxpMold-edit" th:object="${nxpMold}">
            <input name="id" th:field="*{id}" type="hidden">
            <div class="form-group">
                <label class="col-sm-3 control-label">模具编号：</label>
                <div class="col-sm-8">
                    <input name="moldCode" th:field="*{moldCode}" class="form-control" type="text">
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">产品类型：</label>
                <div class="col-sm-8">
                    <select name="productTypeId" class="form-control m-b select2-multiple" th:with="type=${productTypes}" multiple>
                        <option th:each="dict : ${type}" th:text="${dict.productTypeName}" th:value="${dict.id}" th:selected="${dict.flag}"></option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">模具状态：</label>
                <div class="col-sm-8">
                    <select name="status" class="form-control m-b" th:with="type=${@dict.getType('mold_state')}">
                        <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}" th:field="*{status}"></option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label select2-multiple">适用机型：</label>
                <div class="col-sm-8">
                    <select name="machineModel" class="form-control m-b" th:with="type=${machineModels}" multiple>
                        <option th:each="dict : ${type}" th:text="${dict.name}" th:value="${dict.id}" th:selected="${dict.flag}"></option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">模具类型：</label>
                <div class="col-sm-8">
                    <select name="moldType" class="form-control m-b" th:with="type=${@dict.getType('mold_type')}">
                        <option th:text="BA" th:value="2"></option>
                    </select>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">RMS编号：</label>
                <div class="col-sm-8">
                    <input name="moldRmsCode" th:field="*{moldRmsCode}" class="form-control" type="text">
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">Substrate长宽：</label>
                <div class="col-sm-8">
                    <input name="substrateLength" th:field="*{substrateLength}" class="form-control" type="text">
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">size：</label>
                <div class="col-sm-8">
                    <input name="size" th:field="*{size}" class="form-control" type="text">
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">I/O数量：</label>
                <div class="col-sm-8">
                    <input name="ioNumber" th:field="*{ioNumber}" class="form-control" type="text">
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">pitch：</label>
                <div class="col-sm-8">
                    <input name="pitch" th:field="*{pitch}" class="form-control" type="text">
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">球径：</label>
                <div class="col-sm-8">
                    <input name="sphericalDiameter" th:field="*{sphericalDiameter}" class="form-control" type="text">
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">ID：</label>
                <div class="col-sm-8">
                    <input name="baId" th:field="*{baId}" class="form-control" type="text">
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">矩阵：</label>
                <div class="col-sm-8">
                    <input name="matrix" th:field="*{matrix}" class="form-control" type="text">
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">PIN：</label>
                <div class="col-sm-8">
                    <input name="pin" th:field="*{pin}" class="form-control" type="text">
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">大小：</label>
                <div class="col-sm-8">
                    <input name="bigOrSmall" th:field="*{bigOrSmall}" class="form-control" type="text">
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">模具位置：</label>
                <div class="col-sm-8">
                    <select name="moldAddressId" class="form-control m-b" th:with="type=${nxpSmartCabinets}">
                        <option value="">请选择模具位置</option>
                        <option th:each="dict : ${type}" th:text="${dict.position}" th:value="${dict.id}" th:field="*{moldAddressId}"></option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">绑定设备：</label>
                <div class="col-sm-8">
                    <select name="facilityId" class="form-control m-b" th:with="type=${nxpFacilities}">
                        <option value="0">解绑</option>
                        <option th:each="dict : ${type}" th:text="${dict.number}" th:value="${dict.id}" th:field="*{facilityId}"></option>
                    </select>
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <th:block th:include="include :: select2-js" />
    <script th:inline="javascript">
        var prefix = ctx + "system/baNxpMold";
        $("#form-nxpMold-edit").validate({
            focusCleanup: true
        });

        function submitHandler() {
            if ($.validate.form()) {
                $.operate.save(prefix + "/edit", $('#form-nxpMold-edit').serialize());
            }
        }
    </script>
</body>
</html>
