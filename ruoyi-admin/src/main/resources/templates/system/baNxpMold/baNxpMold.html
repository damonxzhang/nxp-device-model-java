<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('模具管理列表')" />
    <th:block th:include="include :: bootstrap-select-css" />
</head>
<body class="gray-bg">
     <div class="container-div">
        <div class="row">
            <div class="col-sm-12 search-collapse">
                <form id="formId">
                    <div class="select-list">
                        <ul>
                            <li>
                                <label>模具编号：</label>
                                <input type="text" name="moldCode"/>
                            </li>
                            <li>
                                <label>模具状态：</label>
                                <select name="status" th:with="type=${@dict.getType('mold_state')}">
                                    <option value="">所有</option>
                                    <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"></option>
                                </select>
                            </li>
                            <li>
                                <label>RMS：</label>
                                <input type="text" name="moldRmsCode"/>
                            </li>
                            <li>
                                <label>模具位置：</label>
                                <select name="moldAddressId" class="selectpicker" data-live-search="true" th:with="type=${nxpSmartCabinets}">
                                    <option value="">所有</option>
                                    <option th:each="dict : ${type}" th:text="${dict.position}" th:value="${dict.id}"></option>
                                </select>
                            </li>
                            <li>
                                <a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;搜索</a>
                                <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i class="fa fa-refresh"></i>&nbsp;重置</a>
                            </li>
                        </ul>
                    </div>
                </form>
            </div>

            <div class="btn-group-sm" id="toolbar" role="group">
                <a class="btn btn-success" onclick="$.operate.add()" shiro:hasPermission="system:nxpMold:add">
                    <i class="fa fa-plus"></i> 添加
                </a>
                <a class="btn btn-primary single disabled" onclick="$.operate.edit()" shiro:hasPermission="system:nxpMold:edit">
                    <i class="fa fa-edit"></i> 修改
                </a>
                <a class="btn btn-danger multiple disabled" onclick="$.operate.removeAll()" shiro:hasPermission="system:nxpMold:remove">
                    <i class="fa fa-remove"></i> 删除
                </a>
                <a class="btn btn-warning" onclick="$.table.exportExcel()" shiro:hasPermission="system:nxpMold:export">
                    <i class="fa fa-download"></i> 导出
                </a>
            </div>
            <div class="col-sm-12 select-table table-striped">
                <table id="bootstrap-table"></table>
            </div>
        </div>
    </div>
    <th:block th:include="include :: footer" />
     <th:block th:include="include :: bootstrap-select-js" />
    <script th:inline="javascript">
        var editFlag = [[${@permission.hasPermi('system:nxpMold:edit')}]];
        var removeFlag = [[${@permission.hasPermi('system:nxpMold:remove')}]];
        var statusDatas = [[${@dict.getType('mold_state')}]];
        var typeDatas = [[${@dict.getType('mold_type')}]];
        var prefix = ctx + "system/baNxpMold";

        $(function() {
            var options = {
                url: prefix + "/list",
                createUrl: prefix + "/add",
                updateUrl: prefix + "/edit/{id}",
                removeUrl: prefix + "/remove",
                exportUrl: prefix + "/export",
                modalName: "BA模具管理",
                columns: [{
                    checkbox: true
                },
                {
                    field: 'id',
                    title: '主键',
                    visible: false
                },
                {
                    field: 'moldCode',
                    title: '模具编号'
                },
                {
                    field: 'productTypeName',
                    title: '产品类型'
                },
                {
                    field: 'status',
                    title: '模具状态',
                    formatter: function(value, row, index) {
                       return $.table.selectDictLabel(statusDatas, value);
                    }
                },
                {
                    field: 'moldType',
                    title: '模具类型',
                    formatter: function(value, row, index) {
                        return $.table.selectDictLabel(typeDatas, value);
                    }
                },
                {
                    field: 'machineModelName',
                    title: '适用机型'
                },
                {
                    field: 'moldRmsCode',
                    title: 'RMS编号'
                },
                {
                    field: 'substrateLength',
                    title: 'Substrate长宽'
                },
                {
                    field: 'size',
                    title: 'size'
                },
                {
                    field: 'ioNumber',
                    title: 'I/O数量'
                },
                {
                    field: 'pitch',
                    title: 'pitch'
                },
                {
                    field: 'sphericalDiameter',
                    title: '球径'
                },
                {
                    field: 'baId',
                    title: 'ID'
                },
                {
                    field: 'matrix',
                    title: '矩阵'
                },
                {
                    field: 'pin',
                    title: 'PIN'
                },
                {
                    field: 'bigOrSmall',
                    title: '大小'
                },
                {
                    field: 'moldAddress',
                    title: '模具位置'
                },
                {
                    field: 'facilityNumber',
                    title: '绑定设备'
                },
                {
                    title: '操作',
                    align: 'center',
                    formatter: function(value, row, index) {
                        var actions = [];
                        actions.push('<a class="btn btn-success btn-xs ' + editFlag + '" href="javascript:void(0)" onclick="component(\'' + row.id + '\')"><i class="fa fa-edit"></i>部件</a> ');
                        actions.push('<a class="btn btn-success btn-xs ' + editFlag + '" href="javascript:void(0)" onclick="$.operate.edit(\'' + row.id + '\')"><i class="fa fa-edit"></i>编辑</a> ');
                        actions.push('<a class="btn btn-danger btn-xs ' + removeFlag + '" href="javascript:void(0)" onclick="$.operate.remove(\'' + row.id + '\')"><i class="fa fa-remove"></i>删除</a>');
                        return actions.join('');
                    }
                }]
            };
            $.table.init(options);
        });

        function component(id) {
            var url = prefix + '/openComponentList/' + id;
            $.modal.openTab("部件列表", url);
        }
    </script>
</body>
</html>
