<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('周PM复查列表')" />
</head>
<body class="gray-bg">
     <div class="container-div">
        <div class="row">
            <div class="col-sm-12 search-collapse">
                <form id="formId">
                    <div class="select-list">
                        <ul>
                            <li>
                                <label>pm表id：</label>
                                <input type="text" name="pm_id"/>
                            </li>
                            <li>
                                <label>设备检查项id：</label>
                                <input type="text" name="group_item_id"/>
                            </li>
                            <li>
                                <label>检查时间：</label>
                                <input type="text" class="time-input" placeholder="请选择检查时间" name="check_time"/>
                            </li>
                            <li>
                                <label>复查确认：</label>
                                <select name="review_type" th:with="type=${@dict.getType('review_type')}">
                                    <option value="">所有</option>
                                    <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"></option>
                                </select>
                            </li>
                            <li>
                                <label>检查人或者复查人id：</label>
                                <input type="text" name="user_info_id"/>
                            </li>
                            <li>
                                <label>类型：</label>
                                <select name="type" th:with="type=${@dict.getType('review_type_new')}">
                                    <option value="">所有</option>
                                    <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"></option>
                                </select>
                            </li>
                            <li>
                                <label>检查项结果：1：正常；2：异常：</label>
                                <select name="group_item_result" th:with="type=${@dict.getType('group_item_result')}">
                                    <option value="">所有</option>
                                    <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"></option>
                                </select>
                            </li>
                            <li>
                                <a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;搜索</a>
                                <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i class="fa fa-refresh"></i>&nbsp;重置</a>
                            </li>
                        </ul>
                    </div>
                </form>
            </div>

            <div class="btn-group-sm" id="toolbar" role="group">
                <a class="btn btn-success" onclick="$.operate.add()" shiro:hasPermission="system:inspectionPmCheck:add">
                    <i class="fa fa-plus"></i> 添加
                </a>
                <a class="btn btn-primary single disabled" onclick="$.operate.edit()" shiro:hasPermission="system:inspectionPmCheck:edit">
                    <i class="fa fa-edit"></i> 修改
                </a>
                <a class="btn btn-danger multiple disabled" onclick="$.operate.removeAll()" shiro:hasPermission="system:inspectionPmCheck:remove">
                    <i class="fa fa-remove"></i> 删除
                </a>
                <a class="btn btn-warning" onclick="$.table.exportExcel()" shiro:hasPermission="system:inspectionPmCheck:export">
                    <i class="fa fa-download"></i> 导出
                </a>
            </div>
            <div class="col-sm-12 select-table table-striped">
                <table id="bootstrap-table"></table>
            </div>
        </div>
    </div>
    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var editFlag = [[${@permission.hasPermi('system:inspectionPmCheck:edit')}]];
        var removeFlag = [[${@permission.hasPermi('system:inspectionPmCheck:remove')}]];
        var review_typeDatas = [[${@dict.getType('review_type')}]];
        var typeDatas = [[${@dict.getType('review_type_new')}]];
        var group_item_resultDatas = [[${@dict.getType('group_item_result')}]];
        var prefix = ctx + "system/inspectionPmCheck";

        $(function() {
            var options = {
                url: prefix + "/list",
                createUrl: prefix + "/add",
                updateUrl: prefix + "/edit/{id}",
                removeUrl: prefix + "/remove",
                exportUrl: prefix + "/export",
                modalName: "周PM复查",
                columns: [{
                    checkbox: true
                },
                {
                    field: 'id',
                    title: '主键',
                    visible: false
                },
                {
                    field: 'pm_id',
                    title: 'pm表id'
                },
                {
                    field: 'group_item_id',
                    title: '设备检查项id'
                },
                {
                    field: 'check_time',
                    title: '检查时间'
                },
                {
                    field: 'review_type',
                    title: '复查确认',
                    formatter: function(value, row, index) {
                       return $.table.selectDictLabel(review_typeDatas, value);
                    }
                },
                {
                    field: 'user_info_id',
                    title: '检查人或者复查人id'
                },
                {
                    field: 'type',
                    title: '类型',
                    formatter: function(value, row, index) {
                       return $.table.selectDictLabel(typeDatas, value);
                    }
                },
                {
                    field: 'group_item_result',
                    title: '检查项结果：1：正常；2：异常',
                    formatter: function(value, row, index) {
                       return $.table.selectDictLabel(group_item_resultDatas, value);
                    }
                },
                {
                    title: '操作',
                    align: 'center',
                    formatter: function(value, row, index) {
                        var actions = [];
                        actions.push('<a class="btn btn-success btn-xs ' + editFlag + '" href="javascript:void(0)" onclick="$.operate.edit(\'' + row.id + '\')"><i class="fa fa-edit"></i>编辑</a> ');
                        actions.push('<a class="btn btn-danger btn-xs ' + removeFlag + '" href="javascript:void(0)" onclick="$.operate.remove(\'' + row.id + '\')"><i class="fa fa-remove"></i>删除</a>');
                        return actions.join('');
                    }
                }]
            };
            $.table.init(options);
        });
    </script>
</body>
</html>
