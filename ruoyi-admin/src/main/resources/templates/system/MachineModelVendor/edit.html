<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('修改机型&vendor中间表')" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-MachineModelVendor-edit" th:object="${nxpMachineModelVendor}">
            <input name="id" th:field="*{id}" type="hidden">
            <div class="form-group">    
                <label class="col-sm-3 control-label">机型：</label>
                <div class="col-sm-8">
                    <select name="modelId" id="modelId" class="form-control select2-multiple">
                        <option value="">请选择机型</option>
                        <option th:each="machineModel:${machineModel}" th:text="${machineModel.name}" th:value="${machineModel.id}" th:field="*{modelId}"></option>
                    </select>
<!--                    <input name="modelId" th:field="*{modelId}" class="form-control" type="text">-->
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">VENDOR：</label>
                <div class="col-sm-8">
                    <select name="vendorId" id="vendorId" class="form-control select2-multiple">
                        <option value="">请选择VENDOR</option>
                        <option th:each="machineVendor:${machineVendor}" th:text="${machineVendor.name}" th:value="${machineVendor.id}" th:field="*{vendorId}"></option>
                    </select>
<!--                    <input name="vendorId" th:field="*{vendorId}" class="form-control" type="text">-->
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var prefix = ctx + "system/MachineModelVendor";
        $("#form-MachineModelVendor-edit").validate({
            focusCleanup: true
        });

        function submitHandler() {
            if ($.validate.form()) {
                $.operate.save(prefix + "/edit", $('#form-MachineModelVendor-edit').serialize());
            }
        }
    </script>
</body>
</html>
