<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('新增设备&产品类型')" />
    <th:block th:include="include :: select2-css" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-nxpFacilityProductType-add">
            <div class="form-group">    
                <label class="col-sm-3 control-label">设备：</label>
                <div class="col-sm-8">
                    <select name="facilityId" class="form-control m-b" th:with="type=${nxpFacilities}">
                        <option value="">请选择产品类型</option>
                        <option th:each="dict : ${type}" th:text="${dict.number}" th:value="${dict.id}"></option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">产品类型：</label>
                <div class="col-sm-8">
                    <select name="productTypeId" class="form-control m-b select2-multiple" multiple th:with="type=${nxpProductTypes}">
                        <option value="">请选择产品类型</option>
                        <option th:each="dict : ${type}" th:text="${dict.productTypeName}" th:value="${dict.id}"></option>
                    </select>
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <th:block th:include="include :: select2-js" />
    <script th:inline="javascript">
        var prefix = ctx + "system/nxpFacilityProductType"
        $("#form-nxpFacilityProductType-add").validate({
            focusCleanup: true
        });

        function submitHandler() {
            if ($.validate.form()) {
                $.operate.save(prefix + "/add", $('#form-nxpFacilityProductType-add').serialize());
            }
        }
    </script>
</body>
</html>
