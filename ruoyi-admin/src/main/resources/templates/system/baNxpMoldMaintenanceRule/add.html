<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('新增模具维护规则')" />
    <th:block th:include="include :: datetimepicker-css" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-nxpMoldMaintenanceRule-add">
            <div class="form-group">
                <label class="col-sm-3 control-label">模具：</label>
                <div class="col-sm-8">
                    <select name="moldId" class="form-control m-b" th:with="type=${nxpMolds}">
                        <option value="">请选择模具</option>
                        <option th:each="dict : ${type}" th:text="${dict.moldCode}" th:value="${dict.id}"></option>
                    </select>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">检查周期：</label>
                <div class="col-sm-8">
                    <input name="cycle" class="form-control" type="text" id="cycle" required>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">提前周期：</label>
                <div class="col-sm-8">
                    <input name="advanceNum" class="form-control" type="text" required>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">规则开始时间：</label>
                <div class="col-sm-8">
                    <div class="input-group date">
                        <input name="beginTime" class="form-control" placeholder="请选择规则开始时间" type="text" id="beginTime" required>
                        <span class="input-group-addon"><i class="fa fa-calendar"></i></span>
                    </div>
                </div>
            </div>
            <!--<div class="form-group">
                <label class="col-sm-3 control-label">规则应执行时间：</label>
                <div class="col-sm-8">
                    <input name="shouldExecuteTime" class="form-control" type="text" id="shouldExecuteTime" readonly>
                </div>
            </div>-->
            <div class="form-group">    
                <label class="col-sm-3 control-label">状态：</label>
                <div class="col-sm-8">
                    <select name="status" class="form-control m-b" th:with="type=${@dict.getType('is_enable')}">
                        <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"></option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">维护类型：</label>
                <div class="col-sm-8">
                    <select name="type" class="form-control m-b" th:with="type=${@dict.getType('maintenance_type')}">
                        <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"></option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">实际执行时间：</label>
                <div class="col-sm-8">
                    <input name="practicalTime" class="form-control" type="text" readonly>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">模具类型：</label>
                <div class="col-sm-8">
                    <select name="moldType" class="form-control m-b">
                        <option th:text="BA" th:value="2"></option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">备注：</label>
                <div class="col-sm-8">
                    <textarea name="remark" class="form-control"></textarea>
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <th:block th:include="include :: datetimepicker-js" />
    <script th:inline="javascript">
        var prefix = ctx + "system/nxpMoldMaintenanceRule"
        $("#form-nxpMoldMaintenanceRule-add").validate({
            focusCleanup: true
        });

        function submitHandler() {
            var beginTime = $("#beginTime").val();
            var date1 = new Date(beginTime);
            var current = getTime();
            var date2 = new Date(current);
            if (date1 < date2){
                $.modal.alertError("规则开始时间不能小于当天");
                return;
            }
            if ($.validate.form()) {
                $.operate.save(prefix + "/add", $('#form-nxpMoldMaintenanceRule-add').serialize());
            }
        }

        function getTime(){
            var currentDate = new Date();
            var year = currentDate.getFullYear();
            var month = ("0" + (currentDate.getMonth() + 1)).slice(-2);
            var date = ("0" + currentDate.getDate()).slice(-2);
            var formattedDate = year + '-' + month + '-' + date;
            return formattedDate;
        }

        $("input[name='beginTime']").datetimepicker({
            format: "yyyy-mm-dd",
            minView: "month",
            autoclose: true
        });

    </script>
</body>
</html>
