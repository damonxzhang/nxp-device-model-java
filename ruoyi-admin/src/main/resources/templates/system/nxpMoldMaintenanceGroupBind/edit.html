<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('修改模具检查组绑定')" />
    <th:block th:include="include :: select2-css" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-nxpMoldMaintenanceGroupBind-edit" th:object="${nxpMoldMaintenanceGroupBind}">
            <input name="id" th:field="*{id}" type="hidden">
            <div class="form-group">    
                <label class="col-sm-3 control-label">模具：</label>
                <div class="col-sm-8">
                    <select name="moldId" class="form-control m-b" th:with="type=${nxpMolds}">
                        <option value="">请选择模具</option>
                        <option th:each="dict : ${type}" th:text="${dict.moldCode}" th:value="${dict.id}" th:field="*{moldId}"></option>
                    </select>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">分组：</label>
                <div class="col-sm-8">
                    <select name="moldMaintenanceGroupId" class="form-control m-b" th:with="type=${nxpMoldMaintenanceGroups}">
                        <option value="">请选择分组</option>
                        <option th:each="dict : ${type}" th:text="${dict.groupName}" th:value="${dict.id}" th:field="*{moldMaintenanceGroupId}"></option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">模具类型：</label>
                <div class="col-sm-8">
                    <select name="moldType" class="form-control m-b">
                        <option th:text="SAW" th:value="1"></option>
                    </select>
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <th:block th:include="include :: select2-js" />
    <script th:inline="javascript">
        var prefix = ctx + "system/nxpMoldMaintenanceGroupBind";
        $("#form-nxpMoldMaintenanceGroupBind-edit").validate({
            focusCleanup: true
        });

        function submitHandler() {
            if ($.validate.form()) {
                $.operate.save(prefix + "/edit", $('#form-nxpMoldMaintenanceGroupBind-edit').serialize());
            }
        }
    </script>
</body>
</html>
