<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('修改每年周PM跳的时间')" />
    <th:block th:include="include :: datetimepicker-css" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-NxpInspectionPmRuleSpecial-edit" th:object="${nxpInspectionPmRuleSpecial}">
            <input name="date" th:field="*{id}" type="hidden">
            <div class="form-group">    
                <label class="col-sm-3 control-label">定时任务启动日期：</label>
                <div class="col-sm-8">
                    <div class="input-group date">
                        <input name="date" th:value="${#dates.format(nxpInspectionPmRuleSpecial.date, 'yyyy-MM-dd')}" class="form-control" placeholder="yyyy-MM-dd" type="date">
                        <span class="input-group-addon"><i class="fa fa-calendar"></i></span>
                    </div>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">向后跳跃天数：</label>
                <div class="col-sm-8">
                    <input name="day" th:field="*{day}" class="form-control" type="text">
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <th:block th:include="include :: datetimepicker-js" />
    <script th:inline="javascript">
        var prefix = ctx + "system/NxpInspectionPmRuleSpecial";
        $("#form-NxpInspectionPmRuleSpecial-edit").validate({
            focusCleanup: true
        });

        function submitHandler() {
            if ($.validate.form()) {
                $.operate.save(prefix + "/edit", $('#form-NxpInspectionPmRuleSpecial-edit').serialize());
            }
        }

    </script>
</body>
</html>
