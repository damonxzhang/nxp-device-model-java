<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('检查列表检查项列表')" />
</head>
<body class="gray-bg">
     <div class="container-div">
        <div class="row">
            <div class="col-sm-12 search-collapse">
                <form id="formId">
                    <div class="select-list">
                        <ul>
                            <li>
                                <label>检查id：</label>
                                <input type="text" name="checkListId"/>
                            </li>
                            <li>
                                <label>是否检查：</label>
                                <select name="isCheck" th:with="type=${@dict.getType('is_check')}">
                                    <option value="">所有</option>
                                    <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"></option>
                                </select>
                            </li>
                            <li>
                                <label>检查内容id：</label>
                                <input type="text" name="checkProjectId"/>
                            </li>
                            <li>
                                <label>检查人id：</label>
                                <input type="text" name="checkUserId"/>
                            </li>
                            <li>
                                <label>检查人姓名：</label>
                                <input type="text" name="checkUserName"/>
                            </li>
                            <li>
                                <label>图片id：</label>
                                <input type="text" name="files"/>
                            </li>
                            <li>
                                <a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;搜索</a>
                                <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i class="fa fa-refresh"></i>&nbsp;重置</a>
                            </li>
                        </ul>
                    </div>
                </form>
            </div>

            <div class="btn-group-sm" id="toolbar" role="group">
                <a class="btn btn-success" onclick="$.operate.add()" shiro:hasPermission="system:nxpCheckListItem:add">
                    <i class="fa fa-plus"></i> 添加
                </a>
                <a class="btn btn-primary single disabled" onclick="$.operate.edit()" shiro:hasPermission="system:nxpCheckListItem:edit">
                    <i class="fa fa-edit"></i> 修改
                </a>
                <a class="btn btn-danger multiple disabled" onclick="$.operate.removeAll()" shiro:hasPermission="system:nxpCheckListItem:remove">
                    <i class="fa fa-remove"></i> 删除
                </a>
                <a class="btn btn-warning" onclick="$.table.exportExcel()" shiro:hasPermission="system:nxpCheckListItem:export">
                    <i class="fa fa-download"></i> 导出
                </a>
            </div>
            <div class="col-sm-12 select-table table-striped">
                <table id="bootstrap-table"></table>
            </div>
        </div>
    </div>
    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var editFlag = [[${@permission.hasPermi('system:nxpCheckListItem:edit')}]];
        var removeFlag = [[${@permission.hasPermi('system:nxpCheckListItem:remove')}]];
        var isCheckDatas = [[${@dict.getType('is_check')}]];
        var prefix = ctx + "system/nxpCheckListItem";

        $(function() {
            var options = {
                url: prefix + "/list",
                createUrl: prefix + "/add",
                updateUrl: prefix + "/edit/{id}",
                removeUrl: prefix + "/remove",
                exportUrl: prefix + "/export",
                modalName: "检查列表检查项",
                columns: [{
                    checkbox: true
                },
                {
                    field: 'id',
                    title: '主键',
                    visible: false
                },
                {
                    field: 'checkListId',
                    title: '检查id'
                },
                {
                    field: 'isCheck',
                    title: '是否检查',
                    formatter: function(value, row, index) {
                       return $.table.selectDictLabel(isCheckDatas, value);
                    }
                },
                {
                    field: 'checkProjectId',
                    title: '检查内容id'
                },
                {
                    field: 'checkUserId',
                    title: '检查人id'
                },
                {
                    field: 'checkUserName',
                    title: '检查人姓名'
                },
                {
                    field: 'checkContent',
                    title: '反馈内容'
                },
                {
                    field: 'files',
                    title: '图片id'
                },
                {
                    title: '操作',
                    align: 'center',
                    formatter: function(value, row, index) {
                        var actions = [];
                        actions.push('<a class="btn btn-success btn-xs ' + editFlag + '" href="javascript:void(0)" onclick="$.operate.edit(\'' + row.id + '\')"><i class="fa fa-edit"></i>编辑</a> ');
                        actions.push('<a class="btn btn-danger btn-xs ' + removeFlag + '" href="javascript:void(0)" onclick="$.operate.remove(\'' + row.id + '\')"><i class="fa fa-remove"></i>删除</a>');
                        return actions.join('');
                    }
                }]
            };
            $.table.init(options);
        });
    </script>
</body>
</html>
