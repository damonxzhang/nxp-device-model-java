<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('修改设备相关人员')" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-inspectionRevelantPeople-edit" th:object="${nxpInspectionRevelantPeople}">
            <input name="id" th:field="*{id}" type="hidden">
            <div class="form-group">    
                <label class="col-sm-3 control-label">inspection id：</label>
                <div class="col-sm-8">
                    <input name="inspection_id" th:field="*{inspection_id}" class="form-control" type="text">
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">设备id：</label>
                <div class="col-sm-8">
                    <input name="facility_id" th:field="*{facility_id}" class="form-control" type="text">
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">设备相关人：</label>
                <div class="col-sm-8">
                    <input name="revelant_people" th:field="*{revelant_people}" class="form-control" type="text">
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var prefix = ctx + "system/inspectionRevelantPeople";
        $("#form-inspectionRevelantPeople-edit").validate({
            focusCleanup: true
        });

        function submitHandler() {
            if ($.validate.form()) {
                $.operate.save(prefix + "/edit", $('#form-inspectionRevelantPeople-edit').serialize());
            }
        }
    </script>
</body>
</html>
