<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('SWC自查问题列表')" />
</head>
<body class="gray-bg">
     <div class="container-div">
        <div class="row">
            <div class="col-sm-12 search-collapse">
                <form id="formId">
                    <div class="select-list">
                        <ul>
                            <li>
                                <label>检查人：</label>
                                <input type="text" name="userId"/>
                            </li>
                            <li>
                                <label>检查时间：</label>
                                <input type="text" class="time-input" placeholder="请选择检查时间" name="checkTime"/>
                            </li>
                            <li>
                                <label>设备编号：</label>
                                <input type="text" name="facilityId"/>
                            </li>
                            <li>
                                <label>批号：</label>
                                <input type="text" name="partNo"/>
                            </li>
                            <li>
                                <label>备注：</label>
                                <input type="text" name="comment"/>
                            </li>
                            <li>
                                <label>问题类型：</label>
                                <select name="type" th:with="type=${@dict.getType('nxp_swc_self_question_type')}">
                                    <option value="">所有</option>
                                    <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"></option>
                                </select>
                            </li>
                            <li>
                                <a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;搜索</a>
                                <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i class="fa fa-refresh"></i>&nbsp;重置</a>
                            </li>
                        </ul>
                    </div>
                </form>
            </div>

            <div class="btn-group-sm" id="toolbar" role="group">
                <a class="btn btn-success" onclick="$.operate.add()" shiro:hasPermission="system:swcCheckSelf:add">
                    <i class="fa fa-plus"></i> 添加
                </a>
                <a class="btn btn-primary single disabled" onclick="$.operate.edit()" shiro:hasPermission="system:swcCheckSelf:edit">
                    <i class="fa fa-edit"></i> 修改
                </a>
                <a class="btn btn-danger multiple disabled" onclick="$.operate.removeAll()" shiro:hasPermission="system:swcCheckSelf:remove">
                    <i class="fa fa-remove"></i> 删除
                </a>
                <a class="btn btn-warning" onclick="$.table.exportExcel()" shiro:hasPermission="system:swcCheckSelf:export">
                    <i class="fa fa-download"></i> 导出
                </a>
            </div>
            <div class="col-sm-12 select-table table-striped">
                <table id="bootstrap-table"></table>
            </div>
        </div>
    </div>
    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var editFlag = [[${@permission.hasPermi('system:swcCheckSelf:edit')}]];
        var removeFlag = [[${@permission.hasPermi('system:swcCheckSelf:remove')}]];
        var typeDatas = [[${@dict.getType('nxp_swc_self_question_type')}]];
        var shiftDatas = [[${@dict.getType('nxp_user_shift')}]];
        var prefix = ctx + "system/swcCheckSelf";

        $(function() {
            var options = {
                url: prefix + "/list",
                createUrl: prefix + "/add",
                updateUrl: prefix + "/edit/{id}",
                removeUrl: prefix + "/remove",
                exportUrl: prefix + "/export",
                modalName: "SWC自查问题",
                columns: [{
                    checkbox: true
                },
                {
                    field: 'id',
                    title: '',
                    visible: false
                },
                {
                    field: 'userName',
                    title: '检查人'
                },
                {
                    field: 'userShift',
                    title: '班别',
                    formatter: function(value, row, index) {
                        return $.table.selectDictLabel(shiftDatas, value);
                    }
                },
                {
                    field: 'userName',
                    title: 'cell lead',
                    visible: false

                },
                {
                    field: 'checkTime',
                    title: '检查时间'
                },
                {
                    field: 'facilityNumber',
                    title: '设备编号'
                },
                {
                    field: 'partNo',
                    title: '批号'
                },
                {
                    field: 'comment',
                    title: '描述'
                },
                {
                    field: 'type',
                    title: '问题类型',
                    formatter: function(value, row, index) {
                       return $.table.selectDictLabel(typeDatas, value);
                    }
                },
                {
                    title: '操作',
                    align: 'center',
                    formatter: function(value, row, index) {
                        var actions = [];
                        var userId = [[${@permission.getPrincipalProperty('userId')}]];
                        if (userId == row.userId){
                            actions.push('<a class="btn btn-success btn-xs ' + editFlag + '" href="javascript:void(0)" onclick="$.operate.edit(\'' + row.id + '\')"><i class="fa fa-edit"></i>编辑</a> ');
                            actions.push('<a class="btn btn-danger btn-xs ' + removeFlag + '" href="javascript:void(0)" onclick="$.operate.remove(\'' + row.id + '\')"><i class="fa fa-remove"></i>删除</a>');
                        }
                        return actions.join('');
                    }
                }]
            };
            $.table.init(options);
        });
    </script>
</body>
</html>
