<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('修改模具部件管理')" />
    <th:block th:include="include :: select2-css" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-nxpMoldComponent-edit" th:object="${nxpMoldComponent}">
            <input name="id" th:field="*{id}" type="hidden">
            <!--<div class="form-group">
                <label class="col-sm-3 control-label">模具编号：</label>
                <div class="col-sm-8">
                    <select name="moldId" class="form-control m-b" th:with="type=${molds}">
                        <option th:each="dict : ${type}" th:text="${dict.moldCode}" th:value="${dict.id}" th:field="*{moldId}"></option>
                    </select>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">部件种类：</label>
                <div class="col-sm-8">
                    <select name="moldTypeId" class="form-control m-b" th:with="type=${nxpMoldTypes}">
                        <option th:each="dict : ${type}" th:text="${dict.moldTypeName}" th:value="${dict.id}" th:field="*{moldTypeId}"></option>
                    </select>
                </div>
            </div>-->
            <div class="form-group">    
                <label class="col-sm-3 control-label">状态：</label>
                <div class="col-sm-8">
                    <select name="status" class="form-control m-b" th:with="type=${@dict.getType('mold_component_state')}">
                        <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}" th:field="*{status}"></option>
                    </select>
                    <!--<select name="status" class="form-control m-b" >
                        <option value="">-&#45;&#45;&#45;&#45;请选择状态-&#45;&#45;&#45;&#45;</option>
                        <option value="1">正常</option>
                    </select>-->
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">备注：</label>
                <div class="col-sm-8">
                    <textarea name="remark" class="form-control">[[*{remark}]]</textarea>
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <th:block th:include="include :: select2-js" />
    <script th:inline="javascript">
        var prefix = ctx + "system/nxpMoldComponent";
        $("#form-nxpMoldComponent-edit").validate({
            focusCleanup: true
        });

        function submitHandler() {
            if ($.validate.form()) {
                $.operate.save(prefix + "/edit", $('#form-nxpMoldComponent-edit').serialize());
            }
        }
    </script>
</body>
