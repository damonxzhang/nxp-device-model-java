<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('修改维修位置')" />
    <th:block th:include="include :: select2-css" />
    <th:block th:include="include :: bootstrap-select-css" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-inspectionPosition-edit" th:object="${nxpInspectionPosition}">
            <input name="id" th:field="*{id}" type="hidden">
            <div class="form-group">    
                <label class="col-sm-3 control-label">位置名称：</label>
                <div class="col-sm-8">
                    <input name="position" th:field="*{position}" class="form-control" type="text">
                </div>
            </div>
<!--            <div class="form-group">-->
<!--                <label class="col-sm-3 control-label">工序：</label>-->
<!--                <div class="col-sm-8">-->
<!--                    <select name="processId" id="processId" class="form-control m-b">-->
<!--                        <option th:each="processes : ${processes}" th:text="${processes.name}" th:value="${processes.id}" th:field="*{processId}"></option>-->
<!--                    </select>-->
<!--                </div>-->
<!--            </div>-->
            <div class="form-group">
                <label class="col-sm-3 control-label">设备机型：</label>
                <div class="col-sm-8">
                    <select name="model_id" id="model_id" class="form-control select2-multiple" data-none-selected-text="请选择维修位置" >
                        <option th:each="model:${model}" th:value="${model.id}" th:text="${model.name}" th:selected="${model.flag}" th:disabled="${model.status == '0'}"></option>
                    </select>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">状态：</label>
                <div class="col-sm-8">
                    <select name="status" class="form-control m-b" th:with="type=${@dict.getType('is_enable')}">
                        <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}" th:field="*{status}"></option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">照片：</label>
                <div class="col-sm-8">
                    <a th:each="nxpInspectionFile : ${nxpInspectionFile}" th:href="${nxpInspectionFile.file_path}" th:title="${nxpInspectionFile.file_path}" target="_blank">
                        <img style="width: 20%;height: 20%" th:each="nxpInspectionFile : ${nxpInspectionFile}" th:src="${nxpInspectionFile.file_path}" class="form-control" ></a>
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <th:block th:include="include :: select2-js" />
    <th:block th:include="include :: bootstrap-select-js" />
    <script th:inline="javascript">
        var prefix = ctx + "system/inspectionPosition";
        $("#form-inspectionPosition-edit").validate({
            focusCleanup: true
        });

        $("#processId").change(function () {
            process_id = $("#processId").val();
            console.log(process_id);
            $.ajax({
                url: prefix + "/getModelByProcess/"+process_id,
                type: "GET",
                success: function (result) {
                    var str = "";
                    $.each(result.msg, function(index, value){
                        console.log(value);
                        str += '<option value="' + value.id + '">' + value.name + '</option>';
                    });
                    console.log(str);
                    //清空之前其他上级菜单遗留的子菜单，否则改变上级菜单后子菜单会包含多个上级菜单的全部子菜单
                    $("#model_id").empty();
                    $("#model_id").append('<option value="">---请选择机型---</option>' + str);
                },
                error: function(error) {
                    $.modal.alertWarning("失败。");
                }});
        });

        function submitHandler() {
            if ($.validate.form()) {
                $.operate.save(prefix + "/edit", $('#form-inspectionPosition-edit').serialize());
            }
        }
    </script>
</body>
</html>
