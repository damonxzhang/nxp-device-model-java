<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('修改模具&产品类型')" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-product-edit" th:object="${nxpMoldProduct}">
            <input name="moldId" th:field="*{moldId}" type="hidden">
            <div class="form-group">
                <label class="col-sm-3 control-label">模具：</label>
                <div class="col-sm-8">
                    <select name="moldId" class="form-control m-b" th:with="type=${nxpMolds}">
                        <option th:each="dict : ${type}" th:text="${dict.moldCode}" th:value="${dict.id}" th:field="*{moldId}"></option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">产品类型：</label>
                <div class="col-sm-8">
                    <select name="productTypeId" class="form-control m-b" th:with="type=${nxpProductTypes}">
                        <option th:each="dict : ${type}" th:text="${dict.productTypeName}" th:value="${dict.id}" th:field="*{productTypeId}"></option>
                    </select>
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var prefix = ctx + "system/product";
        $("#form-product-edit").validate({
            focusCleanup: true
        });

        function submitHandler() {
            if ($.validate.form()) {
                $.operate.save(prefix + "/edit", $('#form-product-edit').serialize());
            }
        }
    </script>
</body>
</html>
