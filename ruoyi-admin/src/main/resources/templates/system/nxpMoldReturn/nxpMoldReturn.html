<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('待归还模具列表')" />
</head>
<body class="gray-bg">
     <div class="container-div">
        <div class="row">
            <div class="col-sm-12 search-collapse">
                <form id="formId">
                    <div class="select-list">
                        <ul>
                            <li>
                                <label>模具编号：</label>
                                <input type="text" name="moldCode"/>
                            </li>
                            <li>
                                <label>设备：</label>
                                <select name="facilityId">
                                    <option value="">所有</option>
                                    <option th:each="facility:${nxpFacilities}" th:text="${facility.number}" th:value="${facility.id}"></option>
                                </select>
                            </li>
                            <li>
                                <label>工序：</label>
                                <select name="processId">
                                    <option value="">所有</option>
                                    <option th:each="process:${processes}" th:text="${process.name}" th:value="${process.id}"></option>
                                </select>
                            </li>
                            <li>
                                <label>设备编号：</label>
                                <input type="text" name="facilityNumber"/>
                            </li>
                            <li>
                                <label>状态：</label>
                                <select name="status" th:with="type=${@dict.getType('mold_return_state')}">
                                    <option value="">所有</option>
                                    <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"></option>
                                </select>
                            </li>
                            <li>
                                <a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;搜索</a>
                                <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i class="fa fa-refresh"></i>&nbsp;重置</a>
                            </li>
                        </ul>
                    </div>
                </form>
            </div>

            <div class="btn-group-sm" id="toolbar" role="group">
                <!--<a class="btn btn-success" onclick="$.operate.add()" shiro:hasPermission="system:nxpMoldReturn:add">
                    <i class="fa fa-plus"></i> 添加
                </a>-->
                <!--<a class="btn btn-primary single disabled" onclick="$.operate.edit()" shiro:hasPermission="system:nxpMoldReturn:edit">
                    <i class="fa fa-edit"></i> 修改
                </a>-->
                <a class="btn btn-danger multiple disabled" onclick="$.operate.removeAll()" shiro:hasPermission="system:nxpMoldReturn:remove">
                    <i class="fa fa-remove"></i> 删除
                </a>
                <a class="btn btn-warning" onclick="$.table.exportExcel()" shiro:hasPermission="system:nxpMoldReturn:export">
                    <i class="fa fa-download"></i> 导出
                </a>
            </div>
            <div class="col-sm-12 select-table table-striped">
                <table id="bootstrap-table"></table>
            </div>
        </div>
    </div>
    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var editFlag = [[${@permission.hasPermi('system:nxpMoldReturn:edit')}]];
        var removeFlag = [[${@permission.hasPermi('system:nxpMoldReturn:remove')}]];
        var detailsFlag = [[${@permission.hasPermi('system:nxpMoldReturn:details')}]];
        var statusDatas = [[${@dict.getType('mold_return_state')}]];
        var returnPositionDatas = [[${@dict.getType('return_position')}]];
        var moldTypeDatas = [[${@dict.getType('mold_type')}]];
        var prefix = ctx + "system/nxpMoldReturn";

        $(function() {
            var options = {
                url: prefix + "/list",
                createUrl: prefix + "/add",
                updateUrl: prefix + "/edit/{id}",
                removeUrl: prefix + "/remove",
                exportUrl: prefix + "/export",
                modalName: "待归还模具",
                columns: [{
                    checkbox: true
                },
                {
                    field: 'id',
                    title: '主键',
                    visible: false
                },
                {
                    field: 'moldCode',
                    title: '模具编号'
                },
                {
                    field: 'facilityNumber',
                    title: '设备编号'
                },
                {
                    field: 'process',
                    title: '工序'
                },
                {
                    field: 'userInfoName',
                    title: '提交人'
                },
                {
                    field: 'status',
                    title: '状态',
                    formatter: function(value, row, index) {
                       return $.table.selectDictLabel(statusDatas, value);
                    }
                },
                {
                    field: 'returnPosition',
                    title: '归还位置',
                    formatter: function(value, row, index) {
                       return $.table.selectDictLabel(returnPositionDatas, value);
                    }
                },
                {
                    field: 'moldType',
                    title: '模具类型',
                    formatter: function(value, row, index) {
                        return $.table.selectDictLabel(moldTypeDatas, value);
                    }
                },
                {
                    field: 'createTime',
                    title: '申请时间',
                    formatter: function(value, row, index) {
                        return $.common.dateFormat(value, "yyyy-MM-dd HH:mm:ss");
                    }
                },
                {
                    field: 'updateTime',
                    title: '更新时间',
                    formatter: function(value, row, index) {
                        return $.common.dateFormat(value, "yyyy-MM-dd HH:mm:ss");
                    }
                },
                {
                    field: 'remark',
                    title: '备注'
                },
                {
                    title: '操作',
                    align: 'center',
                    formatter: function(value, row, index) {
                        var actions = [];
                        actions.push('<a class="btn btn-success btn-xs ' + detailsFlag + '" href="javascript:void(0)" onclick="details(\'' + row.id + '\')"><i class="fa fa-edit"></i>详情</a> ');
                        if (row.status == 1){
                            actions.push('<a class="btn btn-success btn-xs ' + editFlag + '" href="javascript:void(0)" onclick="$.operate.edit(\'' + row.id + '\')"><i class="fa fa-edit"></i>编辑</a> ');
                        }
                        actions.push('<a class="btn btn-danger btn-xs ' + removeFlag + '" href="javascript:void(0)" onclick="$.operate.remove(\'' + row.id + '\')"><i class="fa fa-remove"></i>删除</a>');
                        return actions.join('');
                    }
                }]
            };
            $.table.init(options);
        });

        function details(id) {
            table.set();
            if($.common.isEmpty(id) && table.options.type == table_type.bootstrapTreeTable) {
                var row = $("#" + table.options.id).bootstrapTreeTable('getSelections')[0];
                if ($.common.isEmpty(row)) {
                    $.modal.alertWarning("请至少选择一条记录");
                    return;
                }
                var url = prefix + "/details/" + row[table.options.uniqueId];
                $.modal.open(table.options.modalName + "详情", url);
            } else {
                var url = prefix + "/details/" + id;
                $.modal.open(table.options.modalName + "详情", url);
            }
        }
    </script>
</body>
</html>
