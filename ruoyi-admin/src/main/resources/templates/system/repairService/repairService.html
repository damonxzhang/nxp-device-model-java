<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('维修详情列表')" />
</head>
<body class="gray-bg">
     <div class="container-div">
        <div class="row">
            <div class="col-sm-12 search-collapse">
                <form id="formId">
                    <div class="select-list">
                        <ul>
                            <li>
                                <label>区域：</label>
                                <select name="area_id" id="area_id">
                                    <option value="">所有</option>
                                    <option value ="1">NON-LEAD</option>
                                    <option value ="2">LEAD</option>
                                    <option value ="3">PLATING</option>
                                    <option value ="4">PM</option>
                                </select>
                            </li>
                            <li>
                                <label>工序：</label>
                                <select name="process_id" id="process_id">
                                    <option value="">所有</option>
                                    <option th:each="process:${processes}" th:text="${process.name}" th:value="${process.id}"></option>
                                </select>
                            </li>
                            <li>
                                <label>设备编号：</label>
                                <select name="facility_id" id="facility_id">
                                    <option value="">所有</option>
                                    <option th:each="facility:${nxpFacilities}" th:text="${facility.number}" th:value="${facility.id}"></option>
                                </select>
                            </li>
                            <li>
                                <label>维修状态：</label>
                                <select name="status" th:with="type=${@dict.getType('repair_status')}">
                                    <option value="">所有</option>
                                    <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"></option>
                                </select>
                            </li>
                            <li class="select-time">
                                <label>维修时间： </label>
                                <input type="text" class="time-input" placeholder="开始时间" name="params[repair_start_time]" data-type="datetime" data-format="yyyy-MM-dd HH:mm:ss"/>
                                <span>-</span>
                                <input type="text" class="time-input" placeholder="结束时间" name="params[repair_end_time]" data-type="datetime" data-format="yyyy-MM-dd HH:mm:ss"/>
                            </li>
                            <li>
                                <a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;搜索</a>
                                <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i class="fa fa-refresh"></i>&nbsp;重置</a>
                            </li>
                        </ul>
                    </div>
                </form>
            </div>

<!--            <div class="btn-group-sm" id="toolbar" role="group">-->
<!--                <a class="btn btn-success" onclick="$.operate.add()" shiro:hasPermission="system:repairService:add">-->
<!--                    <i class="fa fa-plus"></i> 添加-->
<!--                </a>-->
<!--                <a class="btn btn-primary single disabled" onclick="$.operate.edit()" shiro:hasPermission="system:repairService:edit">-->
<!--                    <i class="fa fa-edit"></i> 修改-->
<!--                </a>-->
<!--                <a class="btn btn-danger multiple disabled" onclick="$.operate.removeAll()" shiro:hasPermission="system:repairService:remove">-->
<!--                    <i class="fa fa-remove"></i> 删除-->
<!--                </a>-->
<!--                <a class="btn btn-warning" onclick="$.table.exportExcel()" shiro:hasPermission="system:repairService:export">-->
<!--                    <i class="fa fa-download"></i> 导出-->
<!--                </a>-->
<!--            </div>-->
            <div class="col-sm-12 select-table table-striped">
                <table id="bootstrap-table"></table>
            </div>
        </div>
    </div>
    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var editFlag = [[${@permission.hasPermi('system:repairService:edit')}]];
        var removeFlag = [[${@permission.hasPermi('system:repairService:remove')}]];
        var statusDatas = [[${@dict.getType('wx_status')}]];
        var prefix = ctx + "system/repairService";

        $(function() {
            var options = {
                url: prefix + "/list",
                createUrl: prefix + "/add",
                updateUrl: prefix + "/edit/{id}",
                removeUrl: prefix + "/remove",
                exportUrl: prefix + "/export",
                modalName: "维修详情",
                columns: [{
                    checkbox: true
                },
                {
                    field: 'facility_name',
                    title: '设备编号'
                },
                {
                    field: 'process_name',
                    title: '工序'
                },
                {
                    field: 'status',
                    title: '维修状态',
                    formatter: function(value, row, index) {
                        return $.table.selectDictLabel(statusDatas, value);
                    }
                },
                {
                    field: 'head_user',
                    title: '负责人'
                },
                {
                    field: 'positionName',
                    title: '维修位置'
                },
                {
                    field: 'contentName',
                    title: '维修内容'
                },
                {
                    field: 'user_info_name',
                    title: '维修人'
                },
                // {
                //     field: 'service_time',
                //     title: '使用备件'
                // },
                {
                    field: 'service_time',
                    title: '开始时间'
                },
                {
                    field: 'end_time',
                    title: '维修结束时间'
                },
                {
                    field: 'repair_time',
                    title: '维修时长'
                },
                {
                    field: 'inspection_info',
                    title: '相关报修'
                },
                {
                    title: '操作',
                    align: 'center',
                    formatter: function(value, row, index) {
                        var actions = [];
                        actions.push('<a class="btn btn-success btn-xs ' + editFlag + '" href="javascript:void(0)" onclick="$.operate.edit(\'' + row.id + '\')"><i class="fa fa-edit"></i>查看</a> ');
                        actions.push('<a class="btn btn-success btn-xs ' + editFlag + '" href="javascript:void(0)" onclick="inspectionShow(\'' + row.id + '\')"><i class="fa fa-edit"></i>报修信息</a> ');
                        // actions.push('<a class="btn btn-danger btn-xs ' + removeFlag + '" href="javascript:void(0)" onclick="$.operate.remove(\'' + row.id + '\')"><i class="fa fa-remove"></i>删除</a>');
                        return actions.join('');
                    }
                }]
            };
            $.table.init(options);
        });

        function inspectionShow(roleId) {
            var url = prefix + '/inspectionShow/' + roleId;
            $.modal.openTab("报修记录", url);
        }


        // 工序
        $("#area_id").change(function () {
            let areaId = $("#area_id").val();
            $.ajax({
                url: prefix + "/getProcessByArea",
                type: "POST",
                data: {"area":areaId},
                success: function (result) {
                    let str = "";
                    $.each(result.msg, function(index, value){
                        str += '<option value="' + value.id + '">' + value.name + '</option>';
                    });
                    //清空之前其他上级菜单遗留的子菜单，否则改变上级菜单后子菜单会包含多个上级菜单的全部子菜单
                    $("#process_id").empty();
                    $("#process_id").append('<option value="">---请选择区域---</option>' + str);
                },
                error: function(error) {
                    $.modal.alertWarning("失败。");
                }});

        });


        // 工序
        $("#process_id").change(function () {
            let processId = $("#process_id").val();
            $.ajax({
                url: prefix + "/getMathineByProcess",
                type: "POST",
                data: {"process_id":processId},
                success: function (result) {
                    let str = "";
                    $.each(result.msg, function(index, value){
                        str += '<option value="' + value.id + '">' + value.number + '</option>';
                    });
                    //清空之前其他上级菜单遗留的子菜单，否则改变上级菜单后子菜单会包含多个上级菜单的全部子菜单
                    $("#facility_id").empty();
                    $("#facility_id").append('<option value="">---请选择工序---</option>' + str);
                },
                error: function(error) {
                    $.modal.alertWarning("失败。");
                }});

            $.ajax({
                url: prefix + "/getTypeByProcess",
                type: "POST",
                data: {"process_id":processId},
                success: function (result) {
                    let str = "";
                    $.each(result.msg, function(index, value){
                        str += '<option value="' + value.id + '">' + value.name + '</option>';
                    });
                    //清空之前其他上级菜单遗留的子菜单，否则改变上级菜单后子菜单会包含多个上级菜单的全部子菜单
                    $("#question_type").empty();
                    $("#question_type").append('<option value="">---请选择工序---</option>' + str);
                },
                error: function(error) {
                    $.modal.alertWarning("失败。");
                }});
        });


    </script>
</body>
</html>
