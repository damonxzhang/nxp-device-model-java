<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('模具维护检查结果列表')" />
</head>
<body class="gray-bg">
     <div class="container-div">
        <div class="row">
            <div class="col-sm-12 search-collapse">
                <form id="formId">
                    <div class="select-list">
                        <ul>
                            <li>
                                <label>状态：</label>
                                <select name="groupItemResult" th:with="type=${@dict.getType('group_item_result')}">
                                    <option value="">所有</option>
                                    <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"></option>
                                </select>
                            </li>
                            <li>
                                <a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;搜索</a>
                                <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i class="fa fa-refresh"></i>&nbsp;重置</a>
                            </li>
                        </ul>
                    </div>
                </form>
            </div>

            <div class="btn-group-sm" id="toolbar" role="group">
            </div>
            <div class="col-sm-12 select-table table-striped">
                <table id="bootstrap-table"></table>
            </div>
        </div>
    </div>
    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var editFlag = [[${@permission.hasPermi('system:baNxpMoldMaintenanceCheck:edit')}]];
        var removeFlag = [[${@permission.hasPermi('system:baNxpMoldMaintenanceCheck:remove')}]];
        var groupItemResultDatas = [[${@dict.getType('maintenance_result')}]];
        var moldMaintenanceId = [[${moldMaintenanceId}]];
        var prefix = ctx + "system/nxpMoldMaintenanceCheck";

        $(function() {
            var options = {
                url: prefix + "/list",
                updateUrl: prefix + "/edit/{id}",
                queryParams: queryParams,
                modalName: "模具维护检查结果",
                columns: [{
                    checkbox: true
                },
                {
                    field: 'id',
                    title: '主键',
                    visible: false
                },
                {
                    field: 'groupItemName',
                    title: '检查项'
                },
                {
                    field: 'checkTime',
                    title: '检查时间'
                },
                {
                    field: 'userInfoName',
                    title: '检查人'
                },
                {
                    field: 'groupItemResult',
                    title: '检查项结果',
                    formatter: function(value, row, index) {
                       return $.table.selectDictLabel(groupItemResultDatas, value);
                    }
                },
                {
                    field: 'remark',
                    title: '备注'
                },
                {
                    title: '操作',
                    align: 'center',
                    formatter: function(value, row, index) {
                        var actions = [];
                        actions.push('<a class="btn btn-success btn-xs ' + editFlag + '" href="javascript:void(0)" onclick="showInfo(\'' + row.id + '\')"><i class="fa fa-edit"></i>查看</a> ');
                        return actions.join('');
                    }
                }]
            };
            $.table.init(options);
        });

        function showInfo(id) {
            var url = 'system/baNxpMoldMaintenance/maintenanceMessageInfo/' + id;
            $.modal.openTab("维护详情", url);
        }

        function queryParams(params) {
            var search = $.table.queryParams(params);
            search.moldMaintenanceId = moldMaintenanceId;
            return search;
        }
    </script>
</body>
</html>
