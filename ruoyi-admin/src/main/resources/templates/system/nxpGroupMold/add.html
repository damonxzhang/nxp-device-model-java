<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('新增模具&检查组')" />
    <th:block th:include="include :: select2-css" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-nxpGroupMold-add">
            <div class="form-group">    
                <label class="col-sm-3 control-label">检查组：</label>
                <div class="col-sm-8">
                    <select name="groupId" class="form-control m-b" th:with="type=${groups}">
                        <option th:each="dict : ${type}" th:text="${dict.groupName}" th:value="${dict.id}"></option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">模具：</label>
                <div class="col-sm-8">
                    <select name="moldIds" class="form-control m-b select2-multiple" th:with="type=${molds}" multiple>
                        <option th:each="dict : ${type}" th:text="${dict.moldCode}" th:value="${dict.id}"></option>
                    </select>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">状态：</label>
                <div class="col-sm-8">
                    <select name="status" class="form-control m-b" th:with="type=${@dict.getType('is_enable')}">
                        <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"></option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">模具类型：</label>
                <div class="col-sm-8">
                    <select name="moldType" class="form-control m-b">
                        <option th:text="SAW" th:value="1"></option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">备注：</label>
                <div class="col-sm-8">
                    <textarea name="remark" class="form-control"></textarea>
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <th:block th:include="include :: select2-js" />
    <script th:inline="javascript">
        var prefix = ctx + "system/nxpGroupMold"
        $("#form-nxpGroupMold-add").validate({
            focusCleanup: true
        });

        function submitHandler() {
            if ($.validate.form()) {
                $.operate.save(prefix + "/add", $('#form-nxpGroupMold-add').serialize());
            }
        }
    </script>
</body>
</html>
