<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('新增设备型号')" />
    <th:block th:include="include :: select2-css" />
    <th:block th:include="include :: bootstrap-select-css" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-model-add">
            <div class="form-group">    
                <label class="col-sm-3 control-label">机型：</label>
                <div class="col-sm-8">
                    <input name="name" class="form-control" type="text">
                </div>
            </div>
<!--            <div class="form-group">-->
<!--                <label class="col-sm-3 control-label">工序：</label>-->
<!--                <div class="col-sm-8">-->
<!--                    <select name="processId" id="processId" class="form-control m-b">-->
<!--                        <option value="">请选择工序</option>-->
<!--                        <option th:each="process:${processes}" th:text="${process.name}" th:value="${process.id}"></option>-->
<!--                    </select>-->
<!--                </div>-->
<!--            </div>-->
            <div class="form-group">
                <label class="col-sm-3 control-label">维修位置：</label>
                <div class="col-sm-8">
                    <select name="inspection_position" id="inspection_position" class="form-control select2-multiple" data-none-selected-text="请选择维修位置" multiple readonly="readonly">
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">VENDOR：</label>
                <div class="col-sm-8">
                    <select name="vendorId" id="vendorId" class="form-control m-b select2-multiple" >
                        <option value="">请选择VENDOR</option>
                        <option th:each="vendorList : ${vendorList}" th:text="${vendorList.name}" th:value="${vendorList.id}"></option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">区域：</label>
                <div class="col-sm-8">
                    <select name="area" id="area" class="form-control m-b" th:with="type=${@dict.getType('area_arr')}">
                        <option value="">请选择区域</option>
                        <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"></option>
                    </select>
                </div>
            </div>
            <div class="form-group">
<!--                <label class="col-sm-3 control-label">班别：</label>-->
                <div class="col-sm-8">
                    <select name="shift" id="shift" style="display:none" th:with="type=${@dict.getType('shift_arr')}">
                        <option value="">请选择班别</option>
                        <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"></option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">负责人：</label>
                <div class="col-sm-8">
                    <select name="owner" id="owner" class="form-control m-b">
                        <option value="">请先选择区域或者班别</option>
                    </select>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">状态：</label>
                <div class="col-sm-8">
                    <div class="radio-box" th:each="dict : ${@dict.getType('is_enable')}">
                        <input type="radio" th:id="${'status_' + dict.dictCode}" name="status" th:value="${dict.dictValue}" th:checked="${dict.default}" required>
                        <label th:for="${'status_' + dict.dictCode}" th:text="${dict.dictLabel}"></label>
                    </div>
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <th:block th:include="include :: select2-js" />
    <th:block th:include="include :: bootstrap-select-js" />
    <script th:inline="javascript">
        var prefix = ctx + "system/model"
        $("#form-model-add").validate({
            focusCleanup: true
        });


        $(function(){ $("#inspection_position").attr("disabled", "disabled");
            //如果和jquery1.6以上版本，可以使用以下语句：
            $("#inspection_position").prop("disabled", true);});



        $("#processId").change(function () {
            process_id = $("#processId").val();
            $.ajax({
                url: prefix + "/getPositionByProcess/"+process_id,
                type: "GET",
                success: function (result) {
                    var str = "";
                    $.each(result.msg, function(index, value){
                        str += '<option value="' + value.id + '">' + value.position + '</option>';
                    });
                    console.log(str);
                    //清空之前其他上级菜单遗留的子菜单，否则改变上级菜单后子菜单会包含多个上级菜单的全部子菜单
                    $("#inspection_position").empty();
                    $("#inspection_position").append('<option value="">---请选择维修位置---</option>' + str);
                },
                error: function(error) {
                    $.modal.alertWarning("失败。");
                }});
        });

        // 区域
        $("#area").change(function () {
            let area = $("#area").val();
            let shift = $("#shift").val();
            $.ajax({
                url: prefix + "/getUserByAreaAndShift",
                type: "POST",
                data: {"area":area,"shift":shift},
                success: function (result) {
                    let str = "";
                    $.each(result.msg, function(index, value){
                        str += '<option value="' + value.id + '">' + value.chinese_name + '('+ value.pid +')' + '</option>';
                    });
                    //清空之前其他上级菜单遗留的子菜单，否则改变上级菜单后子菜单会包含多个上级菜单的全部子菜单
                    $("#owner").empty();
                    $("#owner").append('<option value="">---请选择负责人---</option>' + str);
                },
                error: function(error) {
                    $.modal.alertWarning("失败。");
                }});
        });
        // 班别
        $("#shift").change(function () {
            let area = $("#area").val();
            let shift = $("#shift").val();
            $.ajax({
                url: prefix + "/getUserByAreaAndShift",
                type: "POST",
                data: {"area":area,"shift":shift},
                success: function (result) {
                    let str = "";
                    $.each(result.msg, function(index, value){
                        str += '<option value="' + value.id + '">' + value.chinese_name + '('+ value.pid +')' + '</option>';
                    });
                    //清空之前其他上级菜单遗留的子菜单，否则改变上级菜单后子菜单会包含多个上级菜单的全部子菜单
                    $("#owner").empty();
                    $("#owner").append('<option value="">---请选择负责人---</option>' + str);
                },
                error: function(error) {
                    $.modal.alertWarning("失败。");
                }});
        });

        function submitHandler() {
            if ($.validate.form()) {
                $.operate.save(prefix + "/add", $('#form-model-add').serialize());
            }
        }
    </script>
</body>
</html>
