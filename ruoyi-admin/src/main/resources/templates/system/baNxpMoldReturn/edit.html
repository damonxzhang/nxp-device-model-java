<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('修改待归还模具')" />
    <th:block th:include="include :: select2-css" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-nxpMoldReturn-edit" th:object="${nxpMoldReturn}">
            <input name="id" th:field="*{id}" type="hidden">
            <div class="form-group">
                <label class="col-sm-3 control-label">模具编号：</label>
                <div class="col-sm-8">
                    <input name="moldCode" id="moldCode" th:field="*{moldCode}" class="form-control" type="text" readonly>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">工序：</label>
                <div class="col-sm-8">
                    <input name="process" th:field="*{process}" class="form-control" type="text" readonly>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">提交人：</label>
                <div class="col-sm-8">
                    <input name="userInfoName" th:field="*{userInfoName}" class="form-control" type="text" readonly>
                </div>
            </div>
            <!--<div class="form-group">
                <label class="col-sm-3 control-label">设备编号：</label>
                <div class="col-sm-8">
                    <input name="facilityNumber" th:field="*{facilityNumber}" class="form-control" type="text" readonly>
                </div>
            </div>-->
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">状态：</label>
                <div class="col-sm-8">
                    <select name="status" class="form-control m-b" id="status" th:with="type=${@dict.getType('mold_return_state')}" onchange="showPosition()" required>
                        <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}" th:field="*{status}"></option>
                    </select>
                </div>
            </div>
            <!--<div class="form-group"  style="display: none" id="showPosition">
                <label class="col-sm-3 control-label">归还位置：</label>
                <div class="col-sm-8">
                    <select name="returnPosition" class="form-control m-b" id="returnPosition">
                    </select>
                </div>
            </div>-->
            <div class="form-group" style="display: none" id="facilityNumber">
                <label class="col-sm-3 control-label">设备编号：</label>
                <div class="col-sm-8">
                    <select name="facilityId" id="facilityId" class="form-control m-b">
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">备注：</label>
                <div class="col-sm-8">
                    <textarea name="remark" class="form-control">[[*{remark}]]</textarea>
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <th:block th:include="include :: select2-js" />
    <script th:inline="javascript">
        var prefix = ctx + "system/nxpMoldReturn";
        $("#form-nxpMoldReturn-edit").validate({
            focusCleanup: true
        });

        function showPosition() {
            let status = $("#status").val();
            if (status == 1){
                // 待归还
                $("#facilityNumber").hide();
                $("#facilityId").val("");
            }
            if (status == 2){
                $("#facilityNumber").hide();
            }
            if (status == 3){
                let moldCode = $("#moldCode").val();
                // 发起查询设备的请求
                $.ajax({
                    url: ctx + "system/facility/selectFacilityByModelAndProductTypeId",
                    type: "POST",
                    data: {"moldCode" : moldCode},
                    success: function (result) {
                        var str = "";
                        $.each(result.data, function(index, value){
                            str += '<option value="' + value.id + '">' + value.number + '</option>';
                        });
                        //清空之前其他上级菜单遗留的子菜单，否则改变上级菜单后子菜单会包含多个上级菜单的全部子菜单
                        $("#facilityId").empty();
                        $("#facilityId").append('<option value="">-----请选择设备-----</option>' + str);
                    },
                    error: function(error) {
                        $.modal.alertWarning("失败。");
                    }
                });
                $("#facilityNumber").show();
            }
        }

        function submitHandler() {
            let status = $("#status").val();
            if (status == 3){
                // 如果归还到设备，那么设备为必填项
                let facilityId = $("#facilityId").val();
                if (facilityId == "" || facilityId == null || facilityId == undefined){
                    $.modal.alertWarning("请选择设备");
                    return;
                }
            }
            if ($.validate.form()) {
                $.operate.save(prefix + "/edit", $('#form-nxpMoldReturn-edit').serialize());
            }
        }
    </script>
</body>
</html>
