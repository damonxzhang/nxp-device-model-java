<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('修改检查内容')" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-checkContent-edit" th:object="${nxpCheckContent}">
            <input name="id" th:field="*{id}" type="hidden">
            <div class="form-group">    
                <label class="col-sm-3 control-label">检查内容：</label>
                <div class="col-sm-8">
                    <input name="checkContent" th:field="*{checkContent}" class="form-control" type="text">
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">检查组：</label>
                <div class="col-sm-8">
                    <!--<input name="processId" th:field="*{processId}" class="form-control" type="text">-->
                    <select name="checkGroupId" class="form-control" th:with="type=${nxpCheckGroups}">
                        <option th:each="dict : ${type}" th:text="${dict.groupName}" th:value="${dict.id}" th:field="*{checkGroupId}">
                        </option>
                    </select>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">工序：</label>
                <div class="col-sm-8">
                    <!--<input name="processId" th:field="*{processId}" class="form-control" type="text">-->
                    <select name="processId" class="form-control" th:with="type=${processes}">
                        <option th:each="dict : ${type}" th:text="${dict.name}" th:value="${dict.id}" th:field="*{processId}">
                        </option>
                    </select>
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var prefix = ctx + "system/checkContent";
        $("#form-checkContent-edit").validate({
            focusCleanup: true
        });

        function submitHandler() {
            if ($.validate.form()) {
                $.operate.save(prefix + "/edit", $('#form-checkContent-edit').serialize());
            }
        }
    </script>
</body>
</html>
