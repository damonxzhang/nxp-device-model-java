<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('修改维修内容')" />
    <th:block th:include="include :: select2-css" />
    <th:block th:include="include :: bootstrap-select-css" />
</head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
    <form class="form-horizontal m" id="form-InspectionContent-edit" th:object="${nxpInspectionContent}">
        <input name="id" th:field="*{id}" type="hidden">
        <div class="form-group">
            <label class="col-sm-3 control-label">设备型号：</label>
            <div class="col-sm-8">
                <select name="modelId"  id="modelId" class="form-control m-b">
                    <option value="">请选择设备型号</option>
                    <option th:each="machineModels:${machineModels}" th:text="${machineModels.name}" th:value="${machineModels.id}" th:field="*{modelId}"></option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">维修位置：</label>
            <div class="col-sm-8">
                <select name="position_id" id="position_id" class="form-control m-b">
                    <option th:each="position : ${positions}" th:text="${position.position}" th:value="${position.id}" th:field="*{position_id}"></option>
<!--                    <option th:value="*{position_id}" th:text="*{positionName}"></option>-->
<!--                    <option value="">请先选择设备型号，再更换维修位置</option>-->

                </select>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">维修内容：</label>
            <div class="col-sm-8">
                <textarea name="content" class="form-control">[[*{content}]]</textarea>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">状态：</label>
            <div class="col-sm-8">
                <select name="status" class="form-control m-b" th:with="type=${@dict.getType('is_enable')}">
                    <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}" th:field="*{status}"></option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">是否更换模具：</label>
            <div class="col-sm-8">
                <select name="is_replace_mold" class="form-control m-b" th:with="type=${@dict.getType('is_replace_mold')}">
                    <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}" th:field="*{is_replace_mold}"></option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">是否必须上传图片：</label>
            <div class="col-sm-8">
                <select name="pic_type" class="form-control m-b" th:with="type=${@dict.getType('is_pic')}">
                    <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}" th:field="*{pic_type}"></option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">是否检查：</label>
            <div class="col-sm-8">
                <select name="is_check" class="form-control m-b" th:with="type=${@dict.getType('is_check')}">
                    <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}" th:field="*{is_check}"></option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">检查人：</label>
            <div class="col-sm-8">
                <input name="check_person" th:field="*{check_person}" class="form-control" type="text">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">检查组工序：</label>
            <div class="col-sm-8">
                <select name="check_process_id" id="processId"  class="form-control">
                    <option value="">请选择工序</option>
                    <option th:each="process:${processes}" th:text="${process.name}" th:value="${process.id}" th:field="*{check_process_id}"></option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">检查组：</label>
            <div class="col-sm-8">
                <select name="check_group_id" id="checkGroupId"  class="form-control">
                    <option value="">请先选择检查组工序，再修改检查组</option>-->
                    <option th:each="checkGroup:${checkGroups}" th:text="${checkGroup.groupName}" th:value="${checkGroup.id}" th:field="*{check_group_id}"></option>
                </select>
            </div>
        </div>
    </form>
</div>
<th:block th:include="include :: footer" />
<th:block th:include="include :: select2-js" />
<th:block th:include="include :: bootstrap-select-js" />
<script th:inline="javascript">
    var prefix = ctx + "system/InspectionContent";
    $("#form-InspectionContent-edit").validate({
        focusCleanup: true
    });

    $("#modelId").change(function () {
        var modelId = $("#modelId").val();
        $.ajax({
            url: ctx + "system/InspectionContent/getPositionByModel/"+ modelId,
            type: "GET",
            success: function (result) {
                var str = "";
                $.each(result.msg, function(index, value){
                    str += '<option value="' + value.id + '">' + value.position + '</option>';
                });
                //清空之前其他上级菜单遗留的子菜单，否则改变上级菜单后子菜单会包含多个上级菜单的全部子菜单
                $("#position_id").empty();
                $("#position_id").append('<option value="">---请选择维修位置---</option>' + str);
            },
            error: function(error) {
                $.modal.alertWarning("失败。");
            }});
    });

    $("#processId").change(function () {
        var processId = $("#processId").val();
        if (processId == '' || processId == undefined){
            //清空之前其他上级菜单遗留的子菜单，否则改变上级菜单后子菜单会包含多个上级菜单的全部子菜单
            $("#checkGroupId").empty();
            $("#checkGroupId").append('<option value="">---请先选择工序---</option>');
        }else {
            $.ajax({
                url: ctx + "system/checkGroup/getByProcessId/" + processId,
                type: "GET",
                success: function (result) {
                    var str = "";
                    $.each(result.data, function(index, value){
                        str += '<option value="' + value.id + '">' + value.groupName + '</option>';
                    });
                    //清空之前其他上级菜单遗留的子菜单，否则改变上级菜单后子菜单会包含多个上级菜单的全部子菜单
                    $("#checkGroupId").empty();
                    $("#checkGroupId").append('<option value="">---请选择工序---</option>' + str);
                },
                error: function(error) {
                    $.modal.alertWarning("失败。");
                }});
        }
    });

    function submitHandler() {
        if ($.validate.form()) {
            $.operate.save(prefix + "/edit", $('#form-InspectionContent-edit').serialize());
        }
    }
</script>
</body>
</html>
